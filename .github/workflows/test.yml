name: Tests

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    # GitHub's implicit run shell is `bash -e` WITHOUT pipefail, so a
    # failure on the left side of a pipe would be silently swallowed.
    # An explicit `shell: bash` runs with `-o pipefail`.
    shell: bash

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test
